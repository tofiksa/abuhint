version: 2
updates:
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Oslo
    commit-message:
      prefix: chore(deps)
    groups:
      maven-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: org.springframework.boot:spring-boot-starter-parent
        update-types:
          - version-update:semver-major
      - dependency-name: org.jetbrains.kotlin:*
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Oslo
    commit-message:
      prefix: chore(ci)

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Oslo
    commit-message:
      prefix: chore(deps)
